# Minimal MediaMTX path example (needs main after #6181, not v1.20.1).
# Apply via API or merge under `paths:` in mediamtx.yml.

pathDefaults:
  rtspTransport: tcp

paths:
  demux-test:
    source: rtsp://127.0.0.1:8555/mp2t
    rtspTransport: tcp
    # Demux RTP MPEG-TS (MP2T) into elementary tracks (H264, ...)
    rtspDemuxMpegts: true
